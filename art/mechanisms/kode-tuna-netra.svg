<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" fill="none">
  <!--
    Kode tuna netra — pairs of short raised lines at the left and right edges.
    Above: the count falls as the denomination rises. Below: in cross-section
    the pairs are relief, which is why they are read by a fingertip.
    Channel: diraba (#9A6B45).
  -->
  <g stroke="#1A1F26" stroke-width="1.6" stroke-linecap="round">
    <!-- 1 · same place on every note: the outer edge -->
    <rect x="24" y="26" width="272" height="46" fill="#E4DFD2" />
    <g stroke="#9A6B45" stroke-width="3" stroke-linecap="round">
      <path d="M34 40l-4 18M42 40l-4 18" />
      <path d="M282 40l4 18M290 40l4 18" />
    </g>
    <path d="M24 26h272v46H24z" stroke="#1A1F26" stroke-width="1.6" fill="none" />

    <!-- 2 · one pair on the largest note, one more with every step down -->
    <g stroke="#9A6B45" stroke-width="2.6" stroke-linecap="round">
      <path d="M60 96l-3 14M67 96l-3 14" />

      <path d="M120 96l-3 14M127 96l-3 14M136 96l-3 14M143 96l-3 14" />

      <path d="M196 96l-3 14M203 96l-3 14M212 96l-3 14M219 96l-3 14M228 96l-3 14M235 96l-3 14" />
    </g>
    <g stroke="#7A828C" stroke-width="0.9" stroke-dasharray="3 3">
      <path d="M50 118h30M110 118h44M186 118h60" />
    </g>

    <!-- 3 · relief, not print: a fingertip reads the ridge -->
    <g stroke="#9A6B45" stroke-width="1.4">
      <path d="M270 104c8-6 20-6 28 0" />
      <path d="M266 112c11-9 25-9 36 0" />
    </g>
    <path d="M262 122h44" stroke="#1A1F26" stroke-width="1.6" />
    <g fill="#9A6B45" stroke="none">
      <path d="M272 122h6l-1-7h-4zM290 122h6l-1-7h-4z" />
    </g>
  </g>

  <g font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">
    <circle cx="160" cy="16" r="9" fill="#9A6B45" />
    <text x="160" y="19" fill="#EFEBE1">1</text>
    <circle cx="64" cy="140" r="9" fill="#9A6B45" />
    <text x="64" y="143" fill="#EFEBE1">2</text>
    <circle cx="284" cy="146" r="9" fill="#9A6B45" />
    <text x="284" y="149" fill="#EFEBE1">3</text>
  </g>
</svg>

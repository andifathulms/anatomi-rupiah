<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" fill="none">
  <!--
    Cetak intaglio — the ink stands proud of the surface, so the ridge is what
    a fingertip meets. Cross-section, exaggerated in height for legibility.
    Channel: diraba (#9A6B45).
  -->
  <g stroke="#1A1F26" stroke-width="1.6" stroke-linecap="round">
    <!-- the substrate -->
    <rect x="30" y="98" width="260" height="28" fill="#E4DFD2" />

    <!-- 1 · ink standing above the surface, not soaked into it -->
    <g fill="#9A6B45" stroke="none">
      <path d="M70 98h16l-3-16h-10z" />
      <path d="M104 98h22l-4-22h-14z" />
      <path d="M144 98h16l-3-14h-10z" />
      <path d="M178 98h26l-5-24h-16z" />
      <path d="M222 98h16l-3-18h-10z" />
    </g>
    <path
      d="M70 98l3-16h10l3 16M104 98l4-22h14l4 22M144 98l3-14h10l3 14M178 98l5-24h16l5 24M222 98l3-18h10l3 18"
      stroke="#1A1F26"
      stroke-width="1.2"
    />

    <!-- surface datum, so the relief is unmistakable -->
    <path d="M30 98h40M238 98h52" stroke="#7A828C" stroke-width="0.9" stroke-dasharray="3 3" />

    <!-- 2 · the fingertip, which is the only instrument that reads this -->
    <path d="M150 34c22 0 38 14 38 30 0 8-6 12-14 12h-48c-8 0-14-4-14-12 0-16 16-30 38-30z" fill="#EFEBE1" />
    <g stroke="#9A6B45" stroke-width="1.1">
      <path d="M132 62c8-10 28-10 36 0M128 54c12-14 32-14 44 0M126 46c14-16 30-16 44 0" />
    </g>
  </g>

  <g font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">
    <circle cx="40" cy="146" r="9" fill="#9A6B45" />
    <text x="40" y="149" fill="#EFEBE1">1</text>
    <circle cx="230" cy="46" r="9" fill="#9A6B45" />
    <text x="230" y="49" fill="#EFEBE1">2</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" fill="none">
  <!--
    Mikroteks — at ordinary reading distance it is a line. Under magnification
    the line resolves into lettering. Drawn as abstract strokes rather than any
    wording from a note.
    Channel: dilihat (#2C6E75).
  -->
  <g stroke="#1A1F26" stroke-width="1.6">
    <!-- 1 · unaided: a rule, nothing more -->
    <rect x="24" y="52" width="120" height="52" fill="#E4DFD2" />
    <path d="M36 78h96" stroke="#1A1F26" stroke-width="1.4" />
    <path d="M36 86h72" stroke="#7A828C" stroke-width="1" />

    <!-- the loupe -->
    <circle cx="200" cy="78" r="46" fill="#EFEBE1" stroke="#1A1F26" stroke-width="2.2" />
    <circle cx="200" cy="78" r="52" stroke="#1A1F26" stroke-width="1.2" />
    <path d="M236 114l24 24" stroke="#1A1F26" stroke-width="4" stroke-linecap="round" />

    <!-- 2 · magnified: the rule is lettering -->
    <g stroke="#2C6E75" stroke-width="1.7" stroke-linecap="round">
      <path d="M168 72v12M168 78h6M180 84v-12h7M180 78h6M195 84v-12M195 72h8v12M212 72v12M212 72h8M212 78h6M228 84v-12h8" />
    </g>
    <path d="M162 92h72" stroke="#7A828C" stroke-width="0.8" stroke-dasharray="3 3" />

    <path d="M150 78h10M154 74l6 4-6 4" stroke="#1A1F26" stroke-width="1.3" />
  </g>

  <g font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">
    <circle cx="84" cy="128" r="9" fill="#2C6E75" />
    <text x="84" y="131" fill="#EFEBE1">1</text>
    <circle cx="200" cy="146" r="9" fill="#2C6E75" />
    <text x="200" y="149" fill="#EFEBE1">2</text>
  </g>
</svg>

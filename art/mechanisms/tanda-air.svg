<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" fill="none">
  <!--
    Tanda air — cross-section. Thickness variation in the substrate modulates
    transmitted light. Schematic, original, non-photorealistic. Callout numbers
    correspond to the localized steps rendered beside the figure.
    Channel: diterawang (#C08A2E).
  -->
  <g stroke="#1A1F26" stroke-width="1.6" stroke-linecap="round">
    <!-- 1 · light behind the note -->
    <g stroke="#C08A2E">
      <path d="M18 52H62M18 70H62M18 88H62M18 106H62" />
      <path d="M56 46l8 6-8 6M56 64l8 6-8 6M56 82l8 6-8 6M56 100l8 6-8 6" fill="none" />
    </g>

    <!-- 2 · the substrate, thick and thin -->
    <path
      d="M86 58H228V92C214 92 214 106 200 106S186 88 172 88S158 108 144 108S130 86 116 86S102 98 86 98Z"
      fill="#E4DFD2"
    />
    <path d="M86 58H228" />

    <!-- 3 · what reaches the eye -->
    <g stroke="none">
      <rect x="248" y="58" width="9" height="48" fill="#1A1F26" opacity="0.10" />
      <rect x="257" y="58" width="9" height="48" fill="#1A1F26" opacity="0.42" />
      <rect x="266" y="58" width="9" height="48" fill="#1A1F26" opacity="0.14" />
      <rect x="275" y="58" width="9" height="48" fill="#1A1F26" opacity="0.48" />
      <rect x="284" y="58" width="9" height="48" fill="#1A1F26" opacity="0.16" />
    </g>
    <rect x="248" y="58" width="45" height="48" stroke="#1A1F26" stroke-width="1.2" />

    <path d="M232 82h12M244 78l6 4-6 4" />
  </g>

  <g font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">
    <circle cx="40" cy="130" r="9" fill="#C08A2E" />
    <text x="40" y="133" fill="#EFEBE1">1</text>
    <circle cx="157" cy="130" r="9" fill="#C08A2E" />
    <text x="157" y="133" fill="#EFEBE1">2</text>
    <circle cx="270" cy="130" r="9" fill="#C08A2E" />
    <text x="270" y="133" fill="#EFEBE1">3</text>
  </g>

  <g stroke="#7A828C" stroke-width="1" stroke-dasharray="2 3">
    <path d="M40 118v-6M157 118v-6M270 118v-6" />
  </g>
</svg>

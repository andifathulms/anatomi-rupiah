<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" fill="none">
  <!--
    Benang pengaman — the thread sits inside the substrate rather than on it,
    surfacing at intervals. Cross-section above, held-to-light view below.
    Channel: diterawang (#C08A2E).
  -->
  <g stroke="#1A1F26" stroke-width="1.6" stroke-linecap="round">
    <!-- cross-section: substrate as two laminae with the thread between -->
    <rect x="40" y="44" width="240" height="30" fill="#E4DFD2" />
    <path d="M40 59h240" stroke="#7A828C" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- 1 · the thread, woven in and out of the surface -->
    <path
      d="M40 59h26c6 0 6-15 12-15h22c6 0 6 15 12 15h26c6 0 6-15 12-15h22c6 0 6 15 12 15h26c6 0 6-15 12-15h22c6 0 6 15 12 15h26"
      stroke="#C08A2E"
      stroke-width="2.6"
    />

    <!-- 2 · windows: where it shows on the surface -->
    <g stroke="#C08A2E" stroke-width="1.2">
      <path d="M78 40v-8M152 40v-8M226 40v-8" />
    </g>
  </g>

  <!-- 3 · diterawang: the same thread reads as one continuous line -->
  <g>
    <rect x="40" y="96" width="240" height="44" fill="#E4DFD2" stroke="#1A1F26" stroke-width="1.6" />
    <path d="M160 96v44" stroke="#C08A2E" stroke-width="3" />
    <g stroke="#C08A2E" stroke-width="1" opacity="0.45">
      <path d="M150 96v44M170 96v44" />
    </g>
  </g>

  <g font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">
    <circle cx="40" cy="86" r="9" fill="#C08A2E" />
    <text x="40" y="89" fill="#EFEBE1">1</text>
    <circle cx="152" cy="24" r="9" fill="#C08A2E" />
    <text x="152" y="27" fill="#EFEBE1">2</text>
    <circle cx="296" cy="118" r="9" fill="#C08A2E" />
    <text x="296" y="121" fill="#EFEBE1">3</text>
  </g>
</svg>
